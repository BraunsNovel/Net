<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yükleniyor... - Braun's Novel</title>
    <link rel="stylesheet" href="css/reader.css">
    <!-- Google Fonts: Okuma için optimize edilmiş fontlar -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Merriweather:wght@400;700&display=swap" rel="stylesheet">
</head>
<body class="theme-light font-sans">
    <!-- İlerleme Çubuğu -->
    <div class="progress-container">
        <div class="progress-bar" id="progressBar"></div>
    </div>

    <!-- Üst Bar -->
    <header class="reader-header">
        <a href="index.html" class="back-link">← Kütüphaneye Dön</a>
        <h1 id="chapterTitle" class="chapter-title">Bölüm Yükleniyor...</h1>
        <button id="settingsToggle" class="settings-btn" aria-label="Ayarlar">⚙️</button>
    </header>

    <!-- Ayarlar Paneli (Gizli) -->
    <div id="settingsPanel" class="settings-panel hidden">
        <div class="setting-group">
            <label>Tema</label>
            <div class="theme-options">
                <button class="theme-btn active" data-theme="theme-light">☀️ Aydınlık</button>
                <button class="theme-btn" data-theme="theme-sepia">📜 Sepya</button>
                <button class="theme-btn" data-theme="theme-dark">🌙 Karanlık</button>
            </div>
        </div>
        <div class="setting-group">
            <label>Yazı Tipi</label>
            <div class="font-options">
                <button class="font-btn active" data-font="font-sans">Sans-Serif</button>
                <button class="font-btn" data-font="font-serif">Serif</button>
            </div>
        </div>
        <div class="setting-group">
            <label>Yazı Boyutu: <span id="fontSizeDisplay">18</span>px</label>
            <div class="size-options">
                <button id="decreaseFont">A-</button>
                <button id="increaseFont">A+</button>
            </div>
        </div>
    </div>

    <!-- Ana İçerik -->
    <main class="reader-content">
        <div class="novel-info">
            <span id="novelTitle" class="novel-name"></span>
        </div>
        
        <div id="translatorNote" class="translator-note hidden"></div>
        
        <article id="chapterContent" class="chapter-text">
            <!-- İçerik buraya JS ile gelecek -->
        </article>

        <!-- Alt Navigasyon -->
        <nav class="chapter-nav">
            <a id="prevBtn" href="#" class="nav-btn disabled">← Önceki Bölüm</a>
            <a href="index.html" class="nav-btn home-btn">📚 Kütüphane</a>
            <a id="nextBtn" href="#" class="nav-btn disabled">Sonraki Bölüm →</a>
        </nav>
    </main>

    <script type="module" src="js/reader.js"></script>
</body>
</html>
