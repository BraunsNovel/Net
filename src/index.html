<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Braun's Novel - Profesyonel Web Novel Platformu</title>
    <link rel="stylesheet" href="css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <nav class="navbar">
        <div class="container nav-container">
            <a href="index.html" class="logo">Braun's Novel</a>
            <div class="nav-links">
                <a href="index.html" class="active">Ana Sayfa</a>
                <a href="#novels-section">Noveller</a>
                <a href="#latest-section">Son Bölümler</a>
            </div>
        </div>
    </nav>

    <header class="hero">
        <div class="container">
            <h1>En İyi Web Novelleri Tek Bir Yerde</h1>
            <p>Profesyonel çeviriler, kesintisiz okuma deneyimi ve düzenli güncellemeler.</p>
        </div>
    </header>

    <main class="container main-content">
        <section id="novels-section" class="content-section">
            <h2 class="section-title">📚 Popüler Noveller</h2>
            <div id="novels-grid" class="novels-grid">
                <p class="loading-text">Noveller yükleniyor...</p>
            </div>
        </section>

        <section id="latest-section" class="content-section">
            <h2 class="section-title">🕒 Son Eklenen Bölümler</h2>
            <ul id="latest-chapters-list" class="latest-chapters-list">
                <p class="loading-text">Bölümler yükleniyor...</p>
            </ul>
        </section>
    </main>

    <footer class="footer">
        <div class="container">
            <p>&copy; 2024 Braun's Novel. Tüm hakları saklıdır.</p>
        </div>
    </footer>

    <script type="module" src="js/app.js"></script>
</body>
</html>
