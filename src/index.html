<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Brauns Novel - Türkçe Web & Light Novel Platformu</title>
  <meta name="description" content="En sevilen Türkçe web novel ve light novel serilerini yüksek kalitede oku.">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <header class="main-header">
    <div class="container header-content">
      <a href="/" class="logo">Brauns Novel</a>
      <div class="search-box">
        <input type="text" id="search-input" placeholder="Roman, orijinal ad veya yazar ara..." autocomplete="off">
        <div id="search-results" class="search-results-dropdown hidden"></div>
      </div>
    </div>
  </header>

  <main class="container">
    <!-- Öne Çıkarılan Romanlar -->
    <section class="section">
      <h2>🔥 Öne Çıkan Seriler</h2>
      <div id="featured-novels" class="novels-grid"></div>
    </section>

    <!-- Tür Filtreleri -->
    <section class="section">
      <h2>🏷️ Türlere Göre Keşfet</h2>
      <div id="genres-list" class="genres-chips"></div>
    </section>

    <!-- Son Yüklenen Bölümler -->
    <section class="section">
      <h2>⚡ Son Yüklenen Bölümler</h2>
      <div id="latest-chapters" class="chapters-list"></div>
    </section>

    <!-- Tüm Romanlar -->
    <section class="section">
      <h2>📚 Tüm Seri Listesi</h2>
      <div id="novels-grid" class="novels-grid"></div>
    </section>
  </main>

  <footer class="main-footer">
    <div class="container">
      <p>&copy; 2026 Brauns Novel. Tüm hakları saklıdır.</p>
    </div>
  </footer>

  <script src="/js/app.js" type="module"></script>
</body>
</html>
