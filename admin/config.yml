backend:
  name: git-gateway
  branch: main

# GÖRSEL YOLU DÜZELTİLDİ
media_folder: "src/uploads"
public_folder: "/uploads"

collections:
  - name: "novels"
    label: "Noveller"
    folder: "content/novels"
    create: true
    slug: "{{title}}"
    fields:
      - { label: "Novel Adı", name: "title", widget: "string" }
      - { label: "Orijinal Adı", name: "original_title", widget: "string", required: false }
      - { label: "Yazar", name: "author", widget: "string" }
      - { label: "Çevirmen", name: "translator", widget: "string" }
      - { label: "Kapak Resmi", name: "cover", widget: "image" }
      - { label: "Türler", name: "genres", widget: "list", default: ["Fantastik"] }
      - { label: "Durum", name: "status", widget: "select", options: ["Devam Ediyor", "Tamamlandı", "Beklemede"] }
      - { label: "Açıklama", name: "body", widget: "markdown" }

  - name: "chapters"
    label: "Bölümler"
    folder: "content/chapters"
    create: true
    slug: "{{novel_slug}}-bolum-{{chapter_number}}"
    fields:
      - { label: "Novel Seçimi (Slug)", name: "novel_slug", widget: "string", hint: "Novelin temiz slug'ını yazın (örn: solo-leyelim)" }
      - { label: "Bölüm Numarası", name: "chapter_number", widget: "number" }
      - { label: "Bölüm Başlığı", name: "title", widget: "string" }
      - { label: "Yayın Tarihi", name: "date", widget: "datetime" }
      - { label: "Çevirmen Notu", name: "translator_note", widget: "markdown", required: false }
      - { label: "Bölüm İçeriği", name: "body", widget: "markdown" }
