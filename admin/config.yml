backend:
  name: git-gateway
  branch: main

media_folder: "src/assets/uploads"
public_folder: "/assets/uploads"

collections:
  # 1. ROMAN BİLGİLERİ (Kapak Resmi, Açıklama, Türler)
  - name: "novels"
    label: "Romanlar"
    folder: "content/novels"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Roman Adı", name: "title", widget: "string" }
      - { label: "Slug (URL Kısaltması)", name: "slug", widget: "string" }
      - { label: "Kapak Görseli", name: "cover", widget: "image", required: false }
      - { label: "Yazar", name: "author", widget: "string", default: "An Ri" }
      - { label: "Durum", name: "status", widget: "select", options: ["Devam Ediyor", "Tamamlandı", "Askıda"] }
      - { label: "Özet / Açıklama", name: "description", widget: "text" }
      - { label: "Etiketler / Türler", name: "tags", widget: "list", default: ["Fantezi", "Aksiyon"] }

  # 2. BÖLÜMLER (Markdown Formatında İçerik)
  - name: "chapters"
    label: "Bölümler"
    folder: "content/chapters"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Bölüm Başlığı", name: "title", widget: "string" }
      - { label: "Ait Olduğu Roman Slug'ı", name: "novelSlug", widget: "string" }
      - { label: "Bölüm Numarası/Sırası", name: "order", widget: "number", value_type: "int" }
      - { label: "Bölüm Slug'ı (örn: bolum-1)", name: "slug", widget: "string" }
      - { label: "Yayın Tarihi", name: "date", widget: "datetime" }
      - { label: "Bölüm İçeriği", name: "body", widget: "markdown" }
